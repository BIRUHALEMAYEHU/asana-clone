name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    # The root tsconfig.json is solution-style ("files": [], "references": [...]),
    # so plain `tsc --noEmit` checks zero files. Build mode walks the references.
    - name: Type Check
      run: npx --no-install tsc -b

    - name: Run Tests
      run: npm test

    - name: Build
      run: npm run build
